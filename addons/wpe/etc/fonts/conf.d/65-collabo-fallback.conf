<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- the wpe add-on's fonts: DejaVu for the generic families, Nanum Gothic after it (Hangul, Hanja,
     kana), so that pages in Korean (or with a few Asian characters) have glyphs -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family><family>NanumGothic</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family><family>NanumGothic</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family><family>NanumGothic</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>DejaVu Sans</family><family>NanumGothic</family></prefer></alias>
  <alias><family>Malgun Gothic</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias><family>Apple SD Gothic Neo</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias><family>Noto Sans KR</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias><family>Noto Sans CJK KR</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>Courier New</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
